<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1540" viewBox="0 0 2100 1540" role="img">
<title>LUỒNG ĐẶT VÉ, THANH TOÁN VÀ HẾT HẠN</title>
<desc>Chọn ghế tạm ≠ tạo SeatHold 5 phút trong database.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="1050" y="70" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#18324B">LUỒNG ĐẶT VÉ, THANH TOÁN VÀ HẾT HẠN</text>
<text x="1050" y="145" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Chọn ghế tạm ≠ tạo SeatHold 5 phút trong database.</text>
<path d="M60 190 H2040" stroke="#D8E4EC" stroke-width="3"/>
<path d="M620,370 L770,370" fill="none" stroke="#55718A" stroke-width="5" stroke-linejoin="round"/>
<polygon points="770,370 752,379.9 752,360.1" fill="#55718A"/>
<path d="M1330,370 L1480,370" fill="none" stroke="#55718A" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1480,370 1462,379.9 1462,360.1" fill="#55718A"/>
<path d="M1760,490 L1760,650" fill="none" stroke="#55718A" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1760,650 1750.1,632 1769.9,632" fill="#55718A"/>
<path d="M1210,785 L980,785" fill="none" stroke="#55718A" stroke-width="5" stroke-linejoin="round"/>
<polygon points="980,785 998,775.1 998,794.9" fill="#55718A"/>
<path d="M520,920 L520,1110" fill="none" stroke="#3E9163" stroke-width="5" stroke-linejoin="round"/>
<polygon points="520,1110 510.1,1092 529.9,1092" fill="#3E9163"/>
<path d="M520,1005 L1625,1005 L1625,1110" fill="none" stroke="#B26E3A" stroke-width="5" stroke-linejoin="round"/>
<polygon points="1625,1110 1615.1,1092 1634.9,1092" fill="#B26E3A"/>
<path d="M60,785 L30,785 L30,1470 L60,1470" fill="none" stroke="#127E83" stroke-width="4" stroke-linejoin="round" stroke-dasharray="11 7"/>
<polygon points="60,1470 42,1479.9 42,1460.1" fill="#127E83"/>
<path d="M1625,1360 L1625,1420" fill="none" stroke="#127E83" stroke-width="4" stroke-linejoin="round" stroke-dasharray="11 7"/>
<polygon points="1625,1420 1615.1,1402 1634.9,1402" fill="#127E83"/>
<rect x="60" y="250" width="560" height="240" rx="20" fill="#EAF7F5" stroke="#42A59A" stroke-width="3"/>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#18324B">1. Khởi tạo ghế</text>
<text x="340" y="375" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">GET /holds</text>
<text x="340" y="430" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Cookie seat_session</text>
<rect x="770" y="250" width="560" height="240" rx="20" fill="#EAF7F5" stroke="#42A59A" stroke-width="3"/>
<text x="1050" y="308" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#18324B">2. Mở SSE</text>
<text x="1050" y="375" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Snapshot</text>
<text x="1050" y="430" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">PUT đồng bộ ghế</text>
<rect x="1480" y="250" width="560" height="240" rx="20" fill="#EAF7F5" stroke="#42A59A" stroke-width="3"/>
<text x="1760" y="308" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#18324B">3. Chọn lạc quan</text>
<text x="1760" y="375" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">POST /seat-events</text>
<text x="1760" y="430" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Lỗi → hoàn tác</text>
<rect x="1210" y="650" width="830" height="270" rx="20" fill="#F1F7FC" stroke="#6893B5" stroke-width="3"/>
<text x="1625" y="695.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#18324B">4. Transaction đặt vé</text>
<text x="1625" y="762.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">POST /api/bookings</text>
<text x="1625" y="817.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Serializable + activeSeat duy nhất</text>
<text x="1625" y="872.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Giá server / PNR</text>
<rect x="60" y="650" width="920" height="270" rx="20" fill="#FFF7E8" stroke="#D1A34C" stroke-width="3"/>
<text x="520" y="695.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#18324B">5. PENDING chiếm ghế</text>
<text x="520" y="762.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Hạn: tối đa 5 phút</text>
<text x="520" y="817.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Không muộn hơn giờ xuất bến</text>
<text x="520" y="872.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">/success → VietQR</text>
<rect x="60" y="1110" width="920" height="250" rx="20" fill="#EDF8EF" stroke="#6EA87F" stroke-width="3"/>
<text x="520" y="1145.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#18324B">6A. CONFIRMED</text>
<text x="520" y="1212.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Payment SUCCESS (Demo)</text>
<text x="520" y="1267.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Không xác minh tiền thực</text>
<text x="520" y="1322.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Không trừ ghế lại</text>
<rect x="1210" y="1110" width="830" height="250" rx="20" fill="#FEF0EC" stroke="#C88976" stroke-width="3"/>
<text x="1625" y="1145.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#18324B">6B. CANCELLED</text>
<text x="1625" y="1212.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Worker quét khoảng 15 giây</text>
<text x="1625" y="1267.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">activeSeat = null</text>
<text x="1625" y="1322.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Hoàn ghế trong transaction</text>
<rect x="60" y="1420" width="1980" height="100" rx="20" fill="#EFF9F8" stroke="#42A59A" stroke-width="3"/>
<text x="1050" y="1470" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#127E83">Tạo / hủy vé → SEATS_CHANGED → GET /holds; polling bổ sung mỗi 5 giây</text>
<rect x="1012" y="709" width="166" height="52" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="1095" y="735" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Commit</text>
<rect x="202" y="989" width="197" height="52" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="300" y="1015" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#31784F">Xác nhận</text>
<rect x="234" y="1040" width="131" height="52" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="300" y="1066" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#31784F">Demo</text>
<rect x="1737" y="1024" width="166" height="52" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="1820" y="1050" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#9D6030">Hết hạn</text>
<rect x="1224" y="539" width="431" height="52" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="1440" y="565" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="44" font-weight="400" fill="#51667A">Thông tin hành khách</text>
</svg>
